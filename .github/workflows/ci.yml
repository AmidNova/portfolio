name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cloudflare Pages refuses any single file above 25 MiB.
      - name: No file over 25 MiB in dist
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::Files over 25 MiB: $big"
            exit 1
          fi
