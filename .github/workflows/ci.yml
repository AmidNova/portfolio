name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The CSP pins the inline theme script by hash; fail if they drift apart.
      - name: CSP covers the inline scripts
        run: node scripts/check-csp.mjs

      # Performance, accessibility, best practices and SEO budgets (lighthouserc.json).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      # Cloudflare Pages refuses any single file above 25 MiB.
      - name: No file over 25 MiB in dist
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::Files over 25 MiB: $big"
            exit 1
          fi

  # Contact form Lambda (backend/contact): unit tests with coverage, stdlib + pytest only.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" # the Lambda runtime
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=contact --cov-fail-under=80
