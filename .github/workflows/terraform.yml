name: Terraform

# Cloudflare infrastructure (infra/cloudflare): plan on every PR that touches it,
# apply the reviewed plan when it lands on main.
on:
  pull_request:
    paths: ["infra/cloudflare/**", ".github/workflows/terraform.yml", ".github/scripts/comment-plan.cjs"]
  push:
    branches: [main]
    paths: ["infra/cloudflare/**", ".github/workflows/terraform.yml", ".github/scripts/comment-plan.cjs"]
  workflow_dispatch:

# One run at a time and never cancelled: an apply must not be cut off halfway.
concurrency:
  group: terraform-cloudflare
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "1"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # The S3 backend reads AWS_* variables; here they hold the R2 state key.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

defaults:
  run:
    working-directory: infra/cloudflare

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="endpoints={s3=\"https://${TF_VAR_account_id}.r2.cloudflarestorage.com\"}"

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          echo "summary=$(grep -E '^(Plan:|No changes)' plan.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            await require("./.github/scripts/comment-plan.cjs")({
              github, context, stack: "Cloudflare",
              planFile: "infra/cloudflare/plan.txt", summary: process.env.SUMMARY,
            });

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -no-color tfplan
